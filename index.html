<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Joyería Sapir · Joyas y relojes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap">
<style>
:root{--bg:#0b0907;--panel:#15110c;--line:#3a2e1c;--gold:#d9b36a;--gold2:#f0d9a3;--ink:#f4ede0;--mute:#a69a84;--glow:#2b200d;--shadow:rgba(0,0,0,.6);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:Jost,system-ui,sans-serif;font-weight:300;line-height:1.55;background:radial-gradient(900px 520px at 85% 0,var(--glow),transparent 65%),var(--bg)}
.w{max-width:1120px;margin:0 auto;padding:0 20px}
a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:26px;padding-bottom:26px}
.logo{font-family:"Cormorant Garamond",Georgia,serif;font-size:30px;font-weight:600;letter-spacing:.06em;color:var(--ink);text-decoration:none}
.top nav{display:flex;gap:26px}
.top nav a{color:var(--ink);text-decoration:none;font-size:15px}
.btn{display:inline-flex;gap:8px;align-items:center;justify-content:center;padding:12px 24px;border-radius:999px;font:inherit;font-weight:500;font-size:15px;text-decoration:none;cursor:pointer;border:1px solid var(--gold);color:var(--gold2);background:none}
.btn.fill{background:linear-gradient(#f0d9a3,#c99a3b);color:#1a1208;border-color:transparent}
.btn svg{width:18px;height:18px}
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:40px;align-items:center;padding-top:36px;padding-bottom:56px}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:clamp(42px,7vw,76px);line-height:1.02;margin:0}
h1 span{display:block;color:var(--gold2)}
.hero p{color:var(--mute);font-size:18px;max-width:40ch;margin:18px 0 28px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.feat{position:relative;background:linear-gradient(160deg,#1c150c,var(--panel));border:1px solid var(--line);border-radius:18px;padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center}
.feat .art{aspect-ratio:1/1}
.feat h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:34px;line-height:1.05;margin:0 0 6px}
.tag{display:inline-block;background:#4a3414;color:var(--gold2);font-size:13px;padding:2px 12px;border-radius:999px;margin-bottom:10px}
.mat{color:var(--mute);font-size:14px;margin:0}
.price{color:var(--gold2);font-family:"Cormorant Garamond",Georgia,serif;font-size:26px;font-weight:600;margin:8px 0 14px}
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-top:8px;padding-bottom:8px;border-top:1px solid var(--line);padding-top:28px}
.sec{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:38px;margin:0;width:100%}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{background:none;border:1px solid var(--line);color:var(--ink);padding:7px 18px;border-radius:999px;font:inherit;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1a1208}
.sel{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;padding-top:22px;padding-bottom:64px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 14px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;transition:border-color .25s}
.item:hover{border-color:var(--gold)}
.art{position:relative;width:100%;aspect-ratio:1/1;display:grid;place-items:center}
.art::before{content:"";position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle,#33260f 0,transparent 70%)}
.art svg{position:relative;width:82%;height:82%;overflow:visible}
.item h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:28px;line-height:1.1;margin:4px 0 0}
.item .btn{padding:10px 20px;margin-top:auto}
.vacio{grid-column:1/-1;color:var(--mute);text-align:center;padding:60px 0}
footer{border-top:1px solid var(--line);text-align:center;color:var(--mute);padding:28px 20px 44px}
footer a{color:var(--gold2)}
@media (max-width:860px){.hero{grid-template-columns:1fr}.top nav{display:none}.feat{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="w top">
  <a class="logo" href="#">Joyería Sapir</a>
  <nav><a href="#catalogo">Catálogo</a><a href="#catalogo" data-go="Relojes">Relojes</a><a id="contacto" href="#" target="_blank" rel="noopener">Contacto</a></nav>
  <a class="btn fill" id="wa-top" href="#" target="_blank" rel="noopener">WhatsApp</a>
</header>

<section class="w hero">
  <div>
    <h1>Joyas y relojes<span>con brillo que dura.</span></h1>
    <p>Anillos, collares, aretes, pulseras y relojes. Elige tu pieza y pídela directo por WhatsApp.</p>
    <div class="cta"><a class="btn fill" href="#catalogo">Ver catálogo</a><a class="btn" id="wa-hero" href="#" target="_blank" rel="noopener">Hablar con la tienda</a></div>
  </div>
  <div class="feat" id="feat"></div>
</section>

<section id="catalogo">
  <div class="w filtros">
    <h2 class="sec">Catálogo</h2>
    <div class="tabs" id="tabs" role="group" aria-label="Categorías"></div>
    <div class="sel">
      <select id="mat" aria-label="Material"><option value="">Material</option><option value="oro">Oro</option><option value="plata">Plata</option></select>
      <select id="gem" aria-label="Piedra o esfera"><option value="">Piedra / esfera</option><option value="zafiro">Zafiro / azul</option><option value="perla">Perla</option><option value="diamante">Diamante</option><option value="ninguna">Sin piedra</option></select>
      <select id="ord" aria-label="Ordenar"><option value="">Recomendados</option><option value="asc">Menor precio</option><option value="desc">Mayor precio</option></select>
    </div>
  </div>
  <main class="w grid" id="lista"></main>
</section>
<footer>¿Buscas otro modelo? <a id="consulta" href="#" target="_blank" rel="noopener">Escríbenos por WhatsApp</a></footer>

<script>
/* ====== EDITA AQUÍ ====== */
var WHATSAPP = "50760000000"; // número con código de país, sin + ni espacios
var TIENDA = "Joyería Sapir";
var MONEDA = "$";
var PRODUCTOS = [
  {n:"Aura",    c:"Anillos",  metal:"oro",   gem:"zafiro",   m:"Oro 18k · zafiro azul", p:420, dest:1},
  {n:"Lumen",   c:"Anillos",  metal:"plata", gem:"diamante", m:"Plata 925 · circonia", p:95},
  {n:"Marea",   c:"Collares", metal:"oro",   gem:"zafiro",   m:"Oro 14k · dije de zafiro", p:310},
  {n:"Fino",    c:"Collares", metal:"plata", gem:"ninguna",  m:"Plata 925 · 45 cm", p:80},
  {n:"Perla",   c:"Aretes",   metal:"oro",   gem:"perla",    m:"Oro 14k · perla natural", p:150},
  {n:"Gota",    c:"Aretes",   metal:"plata", gem:"zafiro",   m:"Plata 925 · zafiro", p:120},
  {n:"Tenis",   c:"Pulseras", metal:"plata", gem:"diamante", m:"Plata 925 · circonia", p:130},
  {n:"Cadena",  c:"Pulseras", metal:"oro",   gem:"ninguna",  m:"Oro 14k", p:240},
  {n:"Meridian",c:"Relojes",  metal:"oro",   gem:"zafiro",   m:"Acabado oro · esfera azul", p:380},
  {n:"Cronos",  c:"Relojes",  metal:"plata", gem:"ninguna",  m:"Acero · esfera blanca", p:210},
  {n:"Estela",  c:"Relojes",  metal:"oro",   gem:"ninguna",  m:"Acabado oro · dama", p:290}
];
/* ========================= */

var SING={Anillos:"Anillo",Collares:"Collar",Aretes:"Aretes",Pulseras:"Pulsera",Relojes:"Reloj"};
var METAL={oro:["#c99a3b","#f1d58c"],plata:["#9aa3ae","#eef1f4"]};
var GEM={zafiro:"#2a58d4",perla:"#f6f2ea",diamante:"#dbe8f7",ninguna:null};
function band(rx,ry,cx,cy,w,m){return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="none" stroke="'+m[0]+'" stroke-width="'+w+'"/><ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="none" stroke="'+m[1]+'" stroke-width="'+(w/3)+'" transform="translate(-1.5 -1.5)" opacity=".8"/>'}
function gem(x,y,r,g){return g?'<polygon points="'+x+','+(y-r)+' '+(x+r)+','+y+' '+x+','+(y+r*1.1)+' '+(x-r)+','+y+'" fill="'+g+'" stroke="#fff" stroke-opacity=".7" stroke-width="1"/><polyline points="'+(x-r)+','+y+' '+(x+r)+','+y+'" stroke="#fff" stroke-opacity=".6"/>':''}
function arte(p){
  var m=METAL[p.metal],g=GEM[p.gem],s='';
  if(p.c==="Anillos"){s=band(44,56,100,118,9,m)+(g?'<rect x="90" y="52" width="20" height="9" fill="'+m[0]+'"/>'+gem(100,40,14,g):'')}
  if(p.c==="Collares"){s='<path d="M26 30 C30 120 70 142 100 142 C130 142 170 120 174 30" fill="none" stroke="'+m[0]+'" stroke-width="3" stroke-dasharray="6 2"/>'+(g?'<line x1="100" y1="142" x2="100" y2="152" stroke="'+m[0]+'" stroke-width="3"/>'+gem(100,166,16,g):'<circle cx="100" cy="148" r="5" fill="'+m[1]+'" stroke="'+m[0]+'" stroke-width="2"/>')}
  if(p.c==="Aretes"){[58,142].forEach(function(x){s+='<path d="M'+x+' 28 q10 0 10 12" fill="none" stroke="'+m[0]+'" stroke-width="3"/><circle cx="'+x+'" cy="62" r="'+(p.gem==="perla"?0:7)+'" fill="'+m[1]+'" stroke="'+m[0]+'" stroke-width="2"/>'+(p.gem==="perla"?'<circle cx="'+x+'" cy="80" r="17" fill="'+g+'" stroke="'+m[0]+'"/><circle cx="'+(x-5)+'" cy="74" r="4" fill="#fff" opacity=".7"/>':'<line x1="'+x+'" y1="68" x2="'+x+'" y2="84" stroke="'+m[0]+'" stroke-width="3"/>'+(g?gem(x,104,17,g):'<circle cx="'+x+'" cy="98" r="12" fill="none" stroke="'+m[0]+'" stroke-width="4"/>'))})}
  if(p.c==="Pulseras"){s=band(66,34,100,100,8,m)+(g?[-48,-24,0,24,48].map(function(d){return '<circle cx="'+(100+d)+'" cy="'+(100+34*Math.sqrt(1-(d/66)*(d/66))).toFixed(1)+'" r="5" fill="'+g+'" stroke="#fff" stroke-opacity=".7"/>'}).join(''):'')}
  if(p.c==="Relojes"){
    var dial=p.gem==="zafiro"?"#173f93":"#f4efe4",hc=p.gem==="zafiro"?"#f1d58c":"#2a2118";
    s='<path d="M78 6h44l6 52H72z M72 142h56l6 52H78z" fill="'+m[0]+'"/><path d="M100 8v50M100 142v50" stroke="'+m[1]+'" stroke-width="1" opacity=".5"/>'
     +'<rect x="146" y="96" width="8" height="8" rx="2" fill="'+m[0]+'"/><circle cx="100" cy="100" r="48" fill="'+m[0]+'"/><circle cx="100" cy="100" r="43" fill="'+m[1]+'"/><circle cx="100" cy="100" r="38" fill="'+dial+'"/>';
    for(var i=0;i<12;i++)s+='<line x1="100" y1="66" x2="100" y2="'+(i%3?70:73)+'" stroke="'+hc+'" stroke-width="'+(i%3?1.2:2)+'" transform="rotate('+i*30+' 100 100)"/>';
    s+='<line x1="100" y1="100" x2="100" y2="82" stroke="'+hc+'" stroke-width="3" stroke-linecap="round" transform="rotate(-60 100 100)"/><line x1="100" y1="100" x2="100" y2="72" stroke="'+hc+'" stroke-width="2" stroke-linecap="round" transform="rotate(60 100 100)"/><circle cx="100" cy="100" r="2.5" fill="'+hc+'"/>';
  }
  return '<svg viewBox="0 0 200 200" role="img" aria-label="'+SING[p.c]+' '+p.n+'">'+s+'</svg>';
}
var WA='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 20l1.2-4A8 8 0 1 1 8 18.8z"/><path d="M9.5 8c0 3.5 2.5 6.5 6.5 7l1-1.5-2-1-1 .8c-1-.4-2-1.4-2.4-2.4l.8-1L11 7z" fill="currentColor" stroke="none"/></svg>';
var CATS=["Todas","Anillos","Collares","Aretes","Pulseras","Relojes"];
var f={c:"Todas",mat:"",gem:"",ord:""};
function link(t){return "https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(t)}
function pedir(p){return link("Hola "+TIENDA+", quiero comprar: "+SING[p.c]+" "+p.n+" ("+MONEDA+p.p+"). ¿Está disponible?")}
function tabs(){document.getElementById("tabs").innerHTML=CATS.map(function(c){return '<button aria-pressed="'+(c===f.c)+'" data-c="'+c+'">'+c+'</button>'}).join("")}
function pintar(){
  var l=PRODUCTOS.filter(function(p){return (f.c==="Todas"||p.c===f.c)&&(!f.mat||p.metal===f.mat)&&(!f.gem||p.gem===f.gem)});
  if(f.ord)l.sort(function(a,b){return f.ord==="asc"?a.p-b.p:b.p-a.p});
  document.getElementById("lista").innerHTML=l.length?l.map(function(p){
    return '<article class="item"><div class="art">'+arte(p)+'</div><h3>'+p.n+'</h3><p class="mat">'+p.m+'</p><p class="price">'+MONEDA+p.p.toFixed(2)+'</p><a class="btn fill" target="_blank" rel="noopener" href="'+pedir(p)+'">'+WA+'Pedir por WhatsApp</a></article>'}).join(""):'<p class="vacio">No hay piezas con esos filtros. Quita alguno para ver más.</p>';
}
var D=PRODUCTOS.filter(function(p){return p.dest})[0]||PRODUCTOS[0];
document.getElementById("feat").innerHTML='<div class="art">'+arte(D)+'</div><div><span class="tag">Pieza destacada</span><h2>'+SING[D.c]+' '+D.n+'</h2><p class="mat">'+D.m+'</p><p class="price">'+MONEDA+D.p.toFixed(2)+'</p><a class="btn fill" target="_blank" rel="noopener" href="'+pedir(D)+'">'+WA+'Pedir por WhatsApp</a></div>';
function ir(c){f.c=c;tabs();pintar()}
document.getElementById("tabs").addEventListener("click",function(e){var c=e.target.getAttribute("data-c");if(c)ir(c)});
document.querySelector("[data-go]").addEventListener("click",function(e){ir(e.target.getAttribute("data-go"))});
["mat","gem","ord"].forEach(function(id){document.getElementById(id).addEventListener("change",function(e){f[id]=e.target.value;pintar()})});
var h=link("Hola "+TIENDA+", quiero hacer una consulta.");
["consulta","contacto","wa-top","wa-hero"].forEach(function(id){document.getElementById(id).href=h});
tabs();pintar();
</script>
</body>
</html>
